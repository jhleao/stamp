name: Migrate release secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal:
    environment: release
    runs-on: ubuntu-latest
    env:
      APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      ENVIRONMENT_PUBLIC_KEY: 5sGN/Uy77awjiYWy37wtkwYob0s8JnyBQymINvOmZAg=
    steps:
      - name: Seal repository secrets for the release environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir encrypted
          cat > "$RUNNER_TEMP/seal.go" <<'EOF'
          package main

          import (
            "crypto/rand"
            "encoding/base64"
            "fmt"
            "os"

            "golang.org/x/crypto/blake2b"
            "golang.org/x/crypto/nacl/box"
          )

          func main() {
            publicKey, err := base64.StdEncoding.DecodeString(os.Getenv("ENVIRONMENT_PUBLIC_KEY"))
            if err != nil || len(publicKey) != 32 {
              panic("invalid environment public key")
            }
            var recipient [32]byte
            copy(recipient[:], publicKey)
            for _, name := range os.Args[1:] {
              value := os.Getenv(name)
              if value == "" {
                panic("missing " + name)
              }
              ephemeralPublic, ephemeralPrivate, err := box.GenerateKey(rand.Reader)
              if err != nil {
                panic(err)
              }
              digest, err := blake2b.New(24, nil)
              if err != nil {
                panic(err)
              }
              _, _ = digest.Write(ephemeralPublic[:])
              _, _ = digest.Write(recipient[:])
              var nonce [24]byte
              copy(nonce[:], digest.Sum(nil))
              sealed := append(ephemeralPublic[:], box.Seal(nil, []byte(value), &nonce, &recipient, ephemeralPrivate)...)
              encoded := base64.StdEncoding.EncodeToString(sealed)
              if err := os.WriteFile("encrypted/"+name, []byte(encoded), 0600); err != nil {
                panic(err)
              }
              fmt.Println("sealed", name)
            }
          }
          EOF
          go run "$RUNNER_TEMP/seal.go" \
            APPLE_DEVELOPER_ID_P12 \
            APPLE_DEVELOPER_ID_P12_PASSWORD \
            APPLE_NOTARY_KEY_P8 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID

      - name: Upload sealed values
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: encrypted-release-secrets
          path: encrypted/
          retention-days: 1
